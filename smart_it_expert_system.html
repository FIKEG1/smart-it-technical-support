<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart IT Technical Support Expert System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #F7F7F2;
  --bg-strong: #F1F1EB;
  --surface:   #FFFFFF;
  --surface2:  #F4F4EF;
  --surface3:  #F9F9F6;
  --border:    #E6E6DE;
  --border2:   #DADACF;
  --text:      #111210;
  --text2:     #4B4E47;
  --text3:     #72766E;
  --brand:     #C6F432;
  --brand-strong:#3D7A00;
  --brand-soft:#F1FCCF;
  --brand-lt:  #F4FCE9;
  --brand-mid: #D6F59C;
  --cyan:      #33D7FF;
  --cyan-lt:   #EAFEFF;
  --purple:    #8C6BFF;
  --purple-lt: #F2ECFF;
  --blue:      #2F6BFF;
  --blue-lt:   #EAF1FF;
  --pink:      #FF6AC1;
  --pink-lt:   #FFE9F7;
  --green:     #00C758;
  --green-lt:  #DCFCE7;
  --amber:     #F59E0B;
  --amber-lt:  #FFF7D8;
  --red:       #FB2C36;
  --red-lt:    #FFE2E2;
  --red-border:#FFCACA;
  --shadow-sm: 0 1px 2px rgba(17,18,16,0.04), 0 8px 18px rgba(17,18,16,0.04);
  --shadow:    0 16px 30px rgba(17,18,16,0.08), 0 3px 12px rgba(17,18,16,0.04);
  --r:         22px;
  --r-sm:      14px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Bricolage Grotesque', 'Geist', 'Manrope', 'Inter', system-ui, sans-serif;
  background:
    radial-gradient(circle at top left, rgba(140, 107, 255, 0.14), transparent 22%),
    radial-gradient(circle at top right, rgba(51, 215, 255, 0.14), transparent 21%),
    radial-gradient(circle at bottom left, rgba(198, 244, 50, 0.14), transparent 18%),
    var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ── LAYOUT ── */
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: 260px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.main {
  flex: 1;
  min-width: 0;
  padding: 36px 40px;
  max-width: 980px;
}

/* ── SIDEBAR ── */
.logo {
  padding: 22px 20px 18px;
  border-bottom: 1px solid var(--border);
}
.logo-mark {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 4px;
}
.logo-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--brand) 0%, var(--purple) 100%);
  border-radius: 12px;
  display: grid; place-items: center;
  flex-shrink: 0;
  box-shadow: 0 10px 18px rgba(35, 101, 245, 0.25);
}
.logo-icon svg { width: 18px; height: 18px; }
.logo-title { font-size: 13.5px; font-weight: 800; color: var(--text); line-height: 1.3; }
.logo-sub { font-size: 11px; color: var(--text3); margin-top: 2px; letter-spacing: .02em; }

.nav { padding: 14px 12px; flex: 1; }
.nav-label {
  font-size: 10.5px;
  font-weight: 800;
  color: var(--text3);
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 0 8px;
  margin: 14px 0 8px;
}
.nav-label:first-child { margin-top: 0; }

.nav-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px 12px;
  border: 1px solid transparent;
  background: transparent;
  border-radius: 12px;
  cursor: pointer;
  font-size: 13.5px;
  color: var(--text2);
  font-family: inherit;
  transition: background .14s ease, color .14s ease, border-color .14s ease, transform .14s ease;
  text-align: left;
  line-height: 1.4;
}
.nav-btn:hover {
  background: var(--surface2);
  color: var(--text);
  border-color: var(--border);
  transform: translateX(2px);
}
.nav-btn.active {
  background: var(--brand-soft);
  color: var(--text);
  font-weight: 700;
  border-color: color-mix(in srgb, var(--brand) 50%, var(--border));
}
.nav-btn .icon { width: 18px; height: 18px; flex-shrink: 0; opacity: .82; }
.nav-btn.active .icon { opacity: 1; }

.nav-all {
  margin: 16px 12px 0;
  padding-bottom: 18px;
  border-top: 1px solid var(--border);
  padding-top: 14px;
}
.btn-all {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 10px 12px;
  background: linear-gradient(135deg, var(--brand) 0%, var(--cyan) 100%);
  color: var(--text);
  border: none; border-radius: 12px;
  font-size: 13.5px; font-weight: 800; cursor: pointer;
  font-family: inherit;
  box-shadow: 0 12px 18px rgba(51, 215, 255, 0.22);
  transition: transform .14s ease, box-shadow .14s ease, filter .14s ease;
}
.btn-all:hover {
  transform: translateY(-1px);
  box-shadow: 0 16px 22px rgba(51, 215, 255, 0.18);
  filter: brightness(1.02);
}

.btn-reset {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 9px 12px; margin-top: 10px;
  background: #fff;
  color: var(--text2);
  border: 1px solid var(--border);
  border-radius: 12px;
  font-size: 12.5px; cursor: pointer; font-family: inherit;
  transition: all .12s;
}
.btn-reset:hover { background: var(--surface2); color: var(--text); }

/* ── MAIN ── */
.page-title { font-size: 28px; font-weight: 800; color: var(--blue); line-height: 1.2; letter-spacing: -0.05em; font-family: 'Bricolage Grotesque', 'Geist', sans-serif; }
.page-sub { font-size: 14px; color: var(--text2); margin-top: 8px; }

/* HOME */
.home-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
  margin-top: 28px;
}
.home-card {
  background: linear-gradient(135deg, rgba(255,255,255,1) 0%, rgba(234,241,255,0.78) 38%, rgba(242,236,255,0.7) 100%);
  border: 1px solid rgba(47, 107, 255, 0.12);
  border-radius: var(--r);
  padding: 20px 18px;
  cursor: pointer;
  transition: border-color .15s, box-shadow .15s, transform .12s, background .12s;
  box-shadow: var(--shadow-sm);
}
.home-card:hover {
  border-color: rgba(47, 107, 255, 0.35);
  box-shadow: var(--shadow);
  transform: translateY(-2px);
  background: linear-gradient(135deg, rgba(234,241,255,0.9) 0%, rgba(255,255,255,1) 35%, rgba(255,233,247,0.8) 100%);
}
.home-card-icon {
  width: 42px; height: 42px;
  background: linear-gradient(135deg, var(--brand-lt) 0%, var(--purple-lt) 100%);
  border-radius: 12px;
  display: grid; place-items: center;
  margin-bottom: 12px;
  border: 1px solid color-mix(in srgb, var(--brand) 20%, var(--border));
}
.home-card-icon svg { width: 20px; height: 20px; color: var(--brand); }
.home-card-title { font-size: 14px; font-weight: 700; color: var(--blue); }
.home-card-count { font-size: 12px; color: var(--text3); margin-top: 3px; }

.full-diag-card {
  margin-top: 16px;
  background: linear-gradient(135deg, var(--brand) 0%, var(--cyan) 35%, var(--purple) 100%);
  border-radius: var(--r);
  padding: 20px 22px;
  cursor: pointer;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 16px 24px rgba(140, 107, 255, 0.18);
  transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
}
.full-diag-card:hover {
  transform: translateY(-1px);
  box-shadow: 0 18px 30px rgba(140, 107, 255, 0.22);
  filter: saturate(1.06);
}
.full-diag-card .fd-title { font-size: 15px; font-weight: 800; }
.full-diag-card .fd-sub { font-size: 13px; opacity: .85; margin-top: 3px; }
.full-diag-card .fd-arrow { font-size: 22px; opacity: .9; }

/* QUESTION PANEL */
.q-panel {
  background: linear-gradient(135deg, rgba(234,241,255,0.9) 0%, rgba(255,255,255,1) 35%, rgba(242,236,255,0.9) 100%);
  border: 1px solid rgba(47, 107, 255, 0.15);
  border-radius: var(--r);
  padding: 30px 32px 32px;
  box-shadow: 0 18px 32px rgba(47, 107, 255, 0.08), 0 3px 12px rgba(17,18,16,0.04);
  margin-top: 24px;
}
.q-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
.q-badge {
  font-size: 11.5px;
  font-weight: 800;
  color: var(--text);
  background: var(--brand);
  padding: 5px 10px;
  border-radius: 999px;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.q-counter { font-size: 12.5px; color: var(--text3); font-weight: 700; }
.progress-bar {
  height: 6px;
  background: var(--surface2);
  border-radius: 999px;
  margin-bottom: 28px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--brand) 0%, #d3f95b 100%);
  border-radius: 999px;
  transition: width .35s ease;
}
.q-text {
  font-size: 17px;
  font-weight: 700;
  color: var(--blue);
  line-height: 1.6;
  margin-bottom: 22px;
}
.q-hint { font-size: 13px; color: var(--text3); margin-bottom: 28px; margin-top: -12px; font-style: italic; }

.q-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
.q-btn {
  flex: 1; min-width: 100px;
  padding: 13px 16px;
  border: 1.5px solid var(--border2);
  border-radius: 12px;
  background: var(--surface);
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all .13s;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  box-shadow: 0 1px 0 rgba(17,18,16,0.02);
}
.q-btn:hover { border-color: var(--brand); color: var(--text); background: linear-gradient(135deg, var(--brand-lt) 0%, var(--blue-lt) 100%); }
.q-btn.yes:hover, .q-btn.yes.selected { border-color: var(--green); color: var(--text); background: linear-gradient(135deg, var(--green-lt) 0%, #ebfff2 100%); }
.q-btn.no:hover,  .q-btn.no.selected  { border-color: var(--red);   color: var(--text);   background: linear-gradient(135deg, var(--red-lt) 0%, #fff2f3 100%); }
.q-btn.unk:hover, .q-btn.unk.selected { border-color: var(--amber); color: var(--text); background: linear-gradient(135deg, var(--amber-lt) 0%, #fff9ec 100%); }

/* DIAGNOSING */
.diagnosing {
  text-align: center;
  padding: 48px 0;
}
.spinner {
  width: 40px; height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 0 auto 18px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.diagnosing p { font-size: 15px; color: var(--text2); }

/* RESULTS */
.results-header { margin-top: 0; margin-bottom: 24px; }
.results-header h2 { font-size: 20px; font-weight: 700; }
.results-header p { font-size: 14px; color: var(--text2); margin-top: 4px; }

.result-card {
  background: linear-gradient(135deg, rgba(255,255,255,1) 0%, rgba(234,241,255,0.8) 32%, rgba(255,255,255,1) 100%);
  border: 1px solid rgba(47, 107, 255, 0.12);
  border-radius: var(--r);
  margin-bottom: 16px;
  box-shadow: 0 14px 26px rgba(47, 107, 255, 0.05), 0 3px 10px rgba(17,18,16,0.03);
  overflow: hidden;
  animation: fadeUp .25s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.result-card:nth-child(2) { animation-delay: .06s; }
.result-card:nth-child(3) { animation-delay: .12s; }
.result-card:nth-child(4) { animation-delay: .18s; }

.result-card.critical { border-color: var(--red-border); }
.result-card.critical .rc-head { background: var(--red-lt); }

.rc-head {
  padding: 18px 20px;
  display: flex;
  align-items: flex-start;
  gap: 16px;
  cursor: pointer;
  user-select: none;
  background: linear-gradient(90deg, rgba(234,241,255,0.65) 0%, rgba(255,255,255,0.2) 100%);
}
.rc-rank {
  width: 28px; height: 28px;
  background: var(--brand);
  color: #fff;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 700;
  flex-shrink: 0;
  margin-top: 1px;
}
.result-card.critical .rc-rank { background: var(--red); }

.rc-info { flex: 1; min-width: 0; }
.rc-name { font-size: 15.5px; font-weight: 700; color: var(--blue); }
.result-card.critical .rc-name { color: var(--red); }

.rc-cf-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 8px;
}
.cf-bar-wrap {
  flex: 1;
  height: 6px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}
.cf-bar {
  height: 100%;
  border-radius: 99px;
  transition: width .6s cubic-bezier(.4,0,.2,1) .15s;
}
.cf-bar.high   { background: var(--green); }
.cf-bar.mid    { background: var(--brand); }
.cf-bar.low    { background: var(--amber); }

.cf-pct { font-size: 13px; font-weight: 700; white-space: nowrap; min-width: 36px; text-align: right; }
.cf-pct.high   { color: var(--green); }
.cf-pct.mid    { color: var(--brand); }
.cf-pct.low    { color: var(--amber); }

.cf-label {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 20px;
  white-space: nowrap;
}
.cf-label.high { background: var(--green-lt); color: var(--green); }
.cf-label.mid  { background: var(--brand-lt); color: var(--brand); }
.cf-label.low  { background: var(--amber-lt); color: var(--amber); }

.rc-toggle {
  color: var(--text3);
  font-size: 18px;
  flex-shrink: 0;
  margin-top: 2px;
  transition: transform .2s;
}
.rc-toggle.open { transform: rotate(180deg); }

.rc-body {
  border-top: 1px solid var(--border);
  padding: 20px 20px 20px 64px;
  display: none;
}
.rc-body.open { display: block; }

.steps-title { font-size: 12px; font-weight: 600; color: var(--text3); letter-spacing: .05em; text-transform: uppercase; margin-bottom: 14px; }
.step-item {
  display: flex;
  gap: 12px;
  margin-bottom: 10px;
  font-size: 13.5px;
  color: var(--text2);
  line-height: 1.55;
}
.step-item.warning {
  background: var(--red-lt);
  border: 1px solid var(--red-border);
  border-radius: var(--r-sm);
  padding: 10px 12px;
  color: var(--red);
  font-weight: 600;
  margin-bottom: 14px;
}
.step-num {
  width: 22px; height: 22px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 11px; font-weight: 700;
  color: var(--text3);
  flex-shrink: 0;
  margin-top: 1px;
}
.step-code {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px 12px;
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 12.5px;
  color: var(--text);
  margin: 6px 0 4px;
  white-space: pre-wrap;
  word-break: break-all;
}

/* NO RESULTS */
.no-results {
  text-align: center;
  padding: 40px 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-top: 24px;
}
.no-results h3 { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
.no-results p  { font-size: 14px; color: var(--text2); max-width: 420px; margin: 0 auto; }

/* ACTIONS BAR */
.actions-bar {
  display: flex; gap: 10px; flex-wrap: wrap;
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
.btn-secondary {
  padding: 9px 18px;
  background: var(--surface); color: var(--text2);
  border: 1.5px solid var(--border2); border-radius: var(--r-sm);
  font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: inherit;
  transition: all .12s;
}
.btn-secondary:hover { background: var(--surface2); color: var(--text); }

/* CATEGORY HEADING */
.cat-heading {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 24px;
}
.cat-heading-icon {
  width: 42px; height: 42px;
  background: var(--brand-lt);
  border-radius: 10px;
  display: grid; place-items: center;
}
.cat-heading-icon svg { width: 22px; height: 22px; color: var(--brand); }
.cat-heading h2 { font-size: 20px; font-weight: 700; color: var(--blue); }
.cat-heading p  { font-size: 13.5px; color: var(--text2); margin-top: 2px; }

/* RESPONSIVE */
@media (max-width: 700px) {
  .sidebar { display: none; }
  .main { padding: 20px 16px; }
  .q-panel { padding: 20px; }
  .rc-body { padding-left: 20px; }
}
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-mark">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
          </svg>
        </div>
        <div class="logo-title">Smart IT Support<br>Expert System</div>
      </div>
      <div class="logo-sub">Backward Chaining · MYCIN CF Engine</div>
    </div>

    <nav class="nav">
      <div class="nav-label">Categories</div>
      <button class="nav-btn active" onclick="showHome()" id="nav-home">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Home
      </button>
      <button class="nav-btn" onclick="startCategory(0)" id="nav-0">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0114.08 0M1.42 9a16 16 0 0121.16 0M8.53 16.11a6 6 0 016.95 0M12 20h.01"/></svg>
        Network & Connectivity
      </button>
      <button class="nav-btn" onclick="startCategory(1)" id="nav-1">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        Operating System
      </button>
      <button class="nav-btn" onclick="startCategory(2)" id="nav-2">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 15h3M1 9h3M1 15h3"/></svg>
        Hardware
      </button>
      <button class="nav-btn" onclick="startCategory(3)" id="nav-3">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        Software & Apps
      </button>
      <button class="nav-btn" onclick="startCategory(4)" id="nav-4">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Security & Malware
      </button>
      <button class="nav-btn" onclick="startCategory(5)" id="nav-5">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Printers
      </button>
      <button class="nav-btn" onclick="startCategory(6)" id="nav-6">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        Email & Comms
      </button>

/* ================================================================
   MYCIN CF ARITHMETIC
   ================================================================ */
function combineCF(cf1, cf2) {
  if (cf1 >= 0 && cf2 >= 0) return cf1 + cf2 * (1 - cf1);
  if (cf1 < 0  && cf2 < 0)  return cf1 + cf2 * (1 + cf1);
  const denom = 1 - Math.min(Math.abs(cf1), Math.abs(cf2));
  return denom === 0 ? 0 : (cf1 + cf2) / denom;
}

function scoreDiagnosis(diag, facts) {
  let cf = null;
  for (const sym of diag.symptoms) {
    const answer = facts[sym.s]; // 1=yes, 0=no, undefined=unknown
    let sc;
    if (answer === undefined) sc = 0;
    else if (answer === sym.e)  sc = sym.w;
    else                        sc = -sym.w;
    cf = cf === null ? sc : combineCF(cf, sc);
  }
  return cf === null ? 0 : cf;
}

/* ================================================================

   ================================================================ */
const catNames = [
  'Network & Connectivity','Operating System','Hardware',
  'Software & Applications','Security & Malware','Printers','Email & Communications','Full Diagnostic'
];
const catNavId = ['nav-0','nav-1','nav-2','nav-3','nav-4','nav-5','nav-6','nav-0'];

function startCategory(catId) {
  currentCat = catId;
  setActiveNav(catNavId[catId] || 'nav-home');

  // Collect all unique symptoms for this category
  const catDiags = catId === 7
    ? KB.diagnoses
    : KB.diagnoses.filter(d => d.cat === catId);

  const symSet = new Set();
  catDiags.forEach(d => d.symptoms.forEach(s => {
    if (!(s.s in facts)) symSet.add(s.s);
  }));
  symptomsQueue = [...symSet];
  answeredCount = 0;
  totalQuestions = symptomsQueue.length;

  if (symptomsQueue.length === 0) {
    runDiagnosis();
    return;
  }
  renderQuestion();
}

function renderQuestion() {
  if (symptomsQueue.length === 0) {
    renderDiagnosing();
    setTimeout(runDiagnosis, 500);
    return;
  }
  const sym = symptomsQueue[0];
  const qText = KB.questions[sym] || sym;
  const progress = totalQuestions > 0 ? (answeredCount / totalQuestions) * 100 : 0;

  document.getElementById('main').innerHTML = `
    <div class="cat-heading">
      <div>
        <h2>${catNames[currentCat]}</h2>
        <p>Answer each question about your system's symptoms</p>
      </div>
    </div>
    <div class="q-panel">
      <div class="q-meta">
        <span class="q-badge">Symptom Check</span>
        <span class="q-counter">Question ${answeredCount + 1} of ${totalQuestions}</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width:${progress}%"></div>
      </div>
      <div class="q-text">${qText}</div>
      <div class="q-hint">Answer based on what you can observe right now. Use "Not sure" if you can't check.</div>
      <div class="q-buttons">

          Not sure

      </div>
    </div>`;
}

function answer(val) {
  const sym = symptomsQueue.shift();
  if (val !== null) facts[sym] = val;
  answeredCount++;
  renderQuestion();
}

function renderDiagnosing() {
  document.getElementById('main').innerHTML = `
    <div class="diagnosing">
      <div class="spinner"></div>
      <p>Analysing symptoms with certainty factors…</p>
    </div>`;
}

/* ================================================================
   RUN DIAGNOSES
   ================================================================ */
function runDiagnosis() {
  const catDiags = currentCat === 7
    ? KB.diagnoses
    : KB.diagnoses.filter(d => d.cat === currentCat);

  const results = catDiags
    .map(d => ({ diag: d, cf: scoreDiagnosis(d, facts) }))
    .filter(r => r.cf >= 0.30)
    .sort((a, b) => b.cf - a.cf);

  renderResults(results);
}

/* ================================================================
   RENDER RESULTS
   ================================================================ */
function cfClass(cf) {
  if (cf >= 0.75) return 'high';
  if (cf >= 0.50) return 'mid';
  return 'low';
}
function cfLabel(cf) {
  if (cf >= 0.90) return 'Very High';
  if (cf >= 0.75) return 'High';
  if (cf >= 0.60) return 'Moderate';
  if (cf >= 0.45) return 'Low-Moderate';
  return 'Low';
}

function renderResults(results) {
  const catDiags = currentCat === 7 ? KB.diagnoses : KB.diagnoses.filter(d => d.cat === currentCat);

  let html = `<div class="results-header">
    <h2>${results.length > 0 ? results.length + ' diagnosis found' : 'No diagnosis reached threshold'}</h2>
    <p>${results.length > 0
      ? 'Results ranked by confidence. Expand each card for step-by-step fix instructions.'
      : 'Try answering "Not sure" instead of "No" for symptoms you could not check, then run again.'}</p>
  </div>`;

  if (results.length === 0) {
    html += `<div class="no-results">
      <h3>No strong match found</h3>
      <p>The symptoms entered don't match any pattern above the 30% confidence threshold. Try a different category or run the Full Diagnostic.</p>
    </div>`;
  }

  results.forEach((r, i) => {
    const pct = Math.round(r.cf * 100);
    const cls = cfClass(r.cf);
    const lbl = cfLabel(r.cf);
    const sol = KB.solutions[r.diag.id] || [];
    const isCrit = r.diag.critical;

    const stepsHtml = sol.map((step, si) => {
      if (step.warn) {
        return `<div class="step-item warning">⚠ ${step.t} — ${step.d}</div>`;
      }
      let inner = `<div><strong>${step.t}</strong>${step.d ? ' — ' + step.d : ''}</div>`;
      if (step.code) inner += `<div class="step-code">${step.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>`;
      return `<div class="step-item"><div class="step-num">${si + 1}</div><div>${inner}</div></div>`;
    }).join('');

    html += `
    <div class="result-card${isCrit ? ' critical' : ''}" style="animation-delay:${i*0.06}s">
      <div class="rc-head" onclick="toggleCard(this)">
        <div class="rc-rank">${i+1}</div>
        <div class="rc-info">
          <div class="rc-name">${r.diag.name}</div>
          <div class="rc-cf-row">
            <div class="cf-bar-wrap"><div class="cf-bar ${cls}" style="width:${pct}%"></div></div>
            <div class="cf-pct ${cls}">${pct}%</div>
            <div class="cf-label ${cls}">${lbl}</div>
          </div>
        </div>
        <div class="rc-toggle">⌄</div>
      </div>
      <div class="rc-body${i === 0 ? ' open' : ''}">
        <div class="steps-title">Recommended Fix Steps</div>
        ${stepsHtml}
      </div>
    </div>`;
  });

  html += `<div class="actions-bar">
    <button class="btn-secondary" onclick="startCategory(${currentCat})">↺ Re-run this category</button>
    <button class="btn-secondary" onclick="showHome()">← Back to categories</button>
    <button class="btn-secondary" onclick="startCategory(7)">Run full diagnostic</button>
  </div>`;

  document.getElementById('main').innerHTML = html;

  // Animate CF bars after paint
  requestAnimationFrame(() => {
    document.querySelectorAll('.cf-bar').forEach(b => {
      const w = b.style.width;
      b.style.width = '0';
      requestAnimationFrame(() => { b.style.width = w; });
    });
  });
}

function toggleCard(head) {
  const body = head.nextElementSibling;
  const toggle = head.querySelector('.rc-toggle');
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  toggle.classList.toggle('open', !isOpen);
}

/* ================================================================
   INIT
   ================================================================ */
showHome();
</script>
</body>
</html>
